name: drone-ops

services:
  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ai:
    build: ./ai-service
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN in .env}
      MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-2}
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      MONGODB_URI: mongodb://mongodb:27017/drone_fleet
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      ALERT_CLASSES: ${ALERT_CLASSES:-person,car,truck,bus,motorcycle,airplane,boat}
    depends_on:
      mongodb:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb_data:
